version: '3.8'

services:
  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    image: ai-agent-builder:latest
    container_name: ai-agent-builder
    restart: unless-stopped
    
    # Environment variables
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EXECUTOR_URL=http://executor:4000/execute
    
    # Port mapping
    ports:
      - "3001:3001"
    
    # Volumes for persistent data
    volumes:
      - ai-agent-data:/app/data
      - ./logs:/app/logs
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Networks
    networks:
      - ai-agent-network

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    image: executor:latest
    container_name: executor
    restart: unless-stopped
    environment:
      - PORT=4000
    ports:
      - "4000:4000"
    networks:
      - ai-agent-network

# Named volumes
volumes:
  ai-agent-data:
    driver: local

# Networks
networks:
  ai-agent-network:
    driver: bridge

  # Executor service
  executor-network:
    driver: bridge

